    html { scroll-behavior: smooth; }

    a:hover { color: var(--teal-500); text-decoration: underline; }

    img { max-width: 100%; height: auto; display: block; }
    code { font-family: var(--font-mono); }

    /* ===== SIDEBAR ===== */
    .sidebar {
      position: fixed;
      top: 0; left: 0;
      width: var(--sidebar-width);

      background: var(--white);

      flex-direction: column;

      border-bottom: 1px solid var(--gray-100);
      flex-shrink: 0;
    }

    .sidebar-brand a {
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--teal-700), var(--teal-500));
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--white);
      font-size: 20px;
      font-weight: 700;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(13, 148, 136, 0.25);
    }

    .brand-text {
      display: flex;
      flex-direction: column;
    }

    .brand-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--gray-900);
      line-height: 1.3;
    }

    .brand-sub {

      position: sticky;
      top: 0;
      z-index: 99;

      padding: 0 16px;
      height: var(--header-height);
      align-items: center;
      gap: 12px;

    .hamburger {
      width: 40px; height: 40px;

      background: transparent;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      border-radius: 8px;
      padding: 8px;

    .hamburger:hover { background: var(--gray-100); }
    .hamburger span {
      display: block;
      width: 22px; height: 2.5px;
      background: var(--gray-700);
      border-radius: 2px;
      transition: 0.3s;
    }

    .topbar-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--gray-800);
    }

    .content-area {
      max-width: 880px;
      margin: 0 auto;
      padding: 48px 48px 80px;

    .content-loading {

      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 80px 20px;
      color: var(--gray-400);
    }

    .content-loading .spinner {
      width: 40px; height: 40px;
      border: 3px solid var(--gray-200);
      border-top-color: var(--teal-700);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .content-error {
      text-align: center;

      color: var(--red-500);
    }

    /* ===== MARKDOWN RENDERED STYLES ===== */

      background: var(--gray-100);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.875em;
      color: var(--red-500);

    .markdown-body pre {
      background: var(--gray-900);
      color: #e9ecef;
      padding: 16px 20px;
      border-radius: 10px;
      overflow-x: auto;
      margin: 1.25rem 0;
      font-size: 0.875rem;
      line-height: 1.6;
    }
    .markdown-body pre code { background: transparent; color: inherit; padding: 0; }

    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 1.25rem 0;
      font-size: 0.95rem;
    }
    .markdown-body th {
      background: var(--teal-700);
      color: var(--white);
      font-weight: 600;

      padding: 10px 14px;
    }
    .markdown-body td { padding: 10px 14px; border-bottom: 1px solid var(--gray-200); }
    .markdown-body tr:nth-child(even) td { background: var(--gray-50); }

    /* ===== OVERLAY ===== */
    .sidebar-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 99;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }
    .sidebar-overlay.show { opacity: 1; pointer-events: auto; }

    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); }
      .sidebar.open { transform: translateX(0); }
      .topbar { display: flex; }
      .main { margin-left: 0; }
      .content-area { padding: 24px 20px 60px; }

  <div class="sidebar-overlay" id="overlay" onclick="closeSidebar()" role="presentation"></div>

  <div class="page-wrap">
    <header class="topbar">
      <button class="hamburger" onclick="toggleSidebar()" aria-label="Toggle navigation menu">
        <span></span><span></span><span></span>
      </button>
      <span class="topbar-title" id="topbarTitle">Product Overview</span>
    </header>

    <main class="main" id="main-content" role="main">
      <article class="content-area" id="content-area">
        <div class="content-loading" id="loading-indicator">
          <div class="spinner"></div>
          <span>Loading documentation…</span>
        </div>

        <div id="content"></div>
      </article>
    </main>
  </div>

  <script>
    const PAGES = {
      overview: {
        file: 'product_overview.md',
        title: 'Product Overview',
        description: 'Product Overview for AI Resume Shortener platform',
      },
      guide: {
        file: 'user_guide.md',
        title: 'User Guide',
        description: 'Complete User Guide for AI Resume Shortener app',
      },
    };

    let currentPage = 'overview';
    let cachedContent = {};

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('overlay');
      const isOpen = sidebar.classList.toggle('open');
      overlay.classList.toggle('show', isOpen);
    }

    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('overlay').classList.remove('show');
    }

    function renderMarkdown(text) {
      marked.setOptions({ breaks: true, gfm: true });
      const html = marked.parse(text);
      const div = document.createElement('div');
      div.className = 'markdown-body';
      div.innerHTML = html;
      return div;
    }

    async function loadPage(pageKey) {
      const page = PAGES[pageKey];
      if (!page) return;

      const contentEl = document.getElementById('content');
      const loadingEl = document.getElementById('loading-indicator');

      if (cachedContent[pageKey]) {
        contentEl.innerHTML = '';
        contentEl.appendChild(cachedContent[pageKey].cloneNode(true));
        updateActiveNav(pageKey);
        document.getElementById('topbarTitle').textContent = page.title;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        return;
      }

      contentEl.innerHTML = '';
      if (loadingEl) loadingEl.style.display = 'flex';

      try {
        const response = await fetch(page.file);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const text = await response.text();

        const rendered = renderMarkdown(text);
        cachedContent[pageKey] = rendered.cloneNode(true);

        if (loadingEl) loadingEl.style.display = 'none';
        contentEl.innerHTML = '';
        contentEl.appendChild(rendered);

        updateActiveNav(pageKey);
        document.getElementById('topbarTitle').textContent = page.title;
        window.scrollTo({ top: 0, behavior: 'smooth' });
        closeSidebar();
      } catch (err) {
        if (loadingEl) loadingEl.style.display = 'none';
        contentEl.innerHTML = `<div class="content-error"><p>Failed to load documentation (${err.message}).</p></div>`;
      }
    }

    function switchPage(pageKey) {
      if (pageKey === currentPage) return;
      currentPage = pageKey;
      loadPage(pageKey);
    }

    function updateActiveNav(pageKey) {
      document.querySelectorAll('.nav-btn').forEach(btn => {
        const isActive = btn.dataset.page === pageKey;
        btn.classList.toggle('active', isActive);
      });
    }

    document.addEventListener('DOMContentLoaded', () => loadPage('overview'));
  </script>
